services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    env_file: app.env
    environment:
      PORT: 8787
    ports:
      - "80:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/api/health').then(r=>r.json()).then(h=>process.exit(h.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
