name: Deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test server/actions.test.js
      - run: npx eslint server src/components/ActionPanel.jsx src/App.jsx
      - run: npm run build
      - name: Docker Hub login
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: printf '%s' "$TOKEN" | docker login -u "$USERNAME" --password-stdin
      - id: image
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          docker buildx create --use
          if [ '${{ github.event_name }}' != 'pull_request' ] && [ '${{ github.ref }}' = 'refs/heads/main' ]; then
            docker buildx build --push --tag "$USERNAME/earthdoctor:sha-$GITHUB_SHA" --metadata-file metadata.json .
            echo "digest=$(jq -r '."containerimage.digest"' metadata.json)" >> "$GITHUB_OUTPUT"
          else
            docker buildx build .
          fi
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VULTR_SSH_KNOWN_HOSTS }}
          HOST: ${{ vars.VULTR_HOST }}
          USER: ${{ vars.VULTR_USER }}
          SSH_PORT: ${{ vars.VULTR_SSH_PORT || '22' }}
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/earthdoctor@${{ needs.build.outputs.digest }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp -o StrictHostKeyChecking=yes -P "$SSH_PORT" compose.production.yml deploy.sh "$USER@$HOST:/opt/earthdoctor/"
          ssh -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$USER@$HOST" "bash /opt/earthdoctor/deploy.sh '$IMAGE'"
          curl --fail --retry 5 --retry-delay 5 "http://$HOST/"
          curl --fail "http://$HOST/api/health"
